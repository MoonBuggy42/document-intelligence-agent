services:
  - type: web
    name: ai-research-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: MISTRALAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
